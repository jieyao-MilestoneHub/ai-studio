[project]
name = "twin"
version = "0.1.0"
description = "Personal digital-twin agent framework — spec at twin/reference/SPEC.md"
readme = "README.md"
license = { file = "LICENSE" }
# Not copying ai-studio's 3.13 pin: that pin exists because of runpod-flash,
# which twin doesn't depend on. Floor raised from >=3.11 to >=3.12 on
# 2026-08-27 while landing the Phase 4 training stack: numpy>=2.3 (pulled in
# transitively by torch/transformers) itself declares requires-python>=3.12
# on PyPI — checked live, not assumed — so >=3.11 was no longer an honest
# claim once those deps were added; `uv sync` would simply fail to resolve on
# a real 3.11 interpreter. Modal/Kaggle base images may impose their own
# tighter floor; that's a launch/*.sh concern, not this file's.
requires-python = ">=3.12,<3.14"

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "google-genai>=2.20.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    # Lowered from the earlier >=2026.7.0 floor (2026-08-27): that pin was
    # simply "latest at Phase 0 time", not a feature twin's own fsspec.open()
    # usage needs. Adding the Phase 4 training stack below made it
    # unsatisfiable — checked live against PyPI (2026-08-27): fsspec's own
    # latest release is 2026.7.0, but `datasets` (latest 5.0.1, a direct
    # dependency of `trl`) caps its own fsspec requirement at <=2026.6.0 and
    # hasn't caught up yet. This is a real, narrow, current ecosystem gap
    # (fsspec ships monthly calendar versions; datasets lags by one), not a
    # guess — resolve by relaxing this floor, not by pinning datasets/trl to
    # something stale.
    "fsspec>=2024.6.1",
    # Phase 4 (twin/PLAN.md) training stack. Versions pinned to what's
    # current as of 2026-08 verification, not guessed from older tutorials:
    # transformers>=5.0 (2026-01) dropped TF/Flax and needs Python>=3.10 /
    # torch>=2.4, so torch's own floor follows from that, not vice versa.
    "torch>=2.4",
    "transformers>=5.16",
    "trl>=1.12",
    "peft>=0.20",
    "accelerate>=1.14",
    "bitsandbytes>=0.50",
    "datasets>=3.0",
    # SPEC.md §8: adapters are personal data ("可反推行為特徵") and MUST be
    # stored encrypted — see core/encryption.py.
    "cryptography>=44.0",
    "modal>=1.5.4",
    "s3fs>=2026.6.0",
    "kaggle>=2.2.4",
    "python-dotenv>=1.2.3",
]

[project.scripts]
twin = "twin.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twin"]

# ---------------------------------------------------------------- tooling

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001-3 flag ambiguous fullwidth punctuation — correct for ai-studio's
# English-only source, wrong here: twin's docstrings routinely quote SPEC.md
# verbatim, which is written in Chinese with fullwidth punctuation by design.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# typer's whole API is call-in-default (`= typer.Option(...)`). B008 is correct
# advice in general and wrong for this one library.
"src/twin/cli/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"  # matches the requires-python floor raised above
strict = true
files = ["src/twin"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "fsspec.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# datasets ships no py.typed marker / stubs as of the pinned version.
module = "datasets.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# trl's top-level __init__ uses a lazy-import (_LazyModule) pattern rather than
# explicit `from .x import Y as Y` re-exports, which strict mode's
# no_implicit_reexport otherwise flags on `from trl import SFTTrainer` even
# though it's trl's own documented public API.
module = "trl"
implicit_reexport = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# ---------------------------------------------------------------- layering
# Independent from ai-studio's import-linter contracts — twin is not part of
# the root uv workspace. Declared from day 0, before any real module content
# exists, for the same reason the root pyproject.toml gives: retrofitting
# layering onto a grown codebase is how this design would die. See
# twin/PLAN.md §3.2 and twin/CLAUDE.md's C1-C4.

[tool.importlinter]
root_package = "twin"
# Several contracts below forbid external packages (google.genai, modal,
# kaggle, ...), not just internal twin.* submodules.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered spine"
type = "layers"
layers = [
    "twin.cli",
    "twin.harness",
    "twin.agent",
    "twin.memory",
    "twin.train",
    "twin.ingest",
    "twin.teacher",
    "twin.config",
    "twin.core",
]

# C1: training must never read live memory content — the spine order already
# implies this, stated explicitly so it survives a future edit to the layers list.
[[tool.importlinter.contracts]]
name = "C1 - training never reads live memory content"
type = "forbidden"
source_modules = ["twin.train"]
forbidden_modules = ["twin.memory"]

# C2/C3: tool schemas are an L4, inference-time concern and must not reach L3
# weights. The spine already blocks train -> agent; this blocks the reverse,
# which a plain layers contract does not catch on its own.
[[tool.importlinter.contracts]]
name = "C2/C3 - serving does not depend on trainer internals"
type = "forbidden"
source_modules = ["twin.agent"]
forbidden_modules = ["twin.train"]

# D12/SPEC.md §7.1: vendor SDK coupling is confined to teacher.py (the other
# allowed file, launch/*.sh, is shell and outside import-linter's reach).
# import-linter can only forbid top-level external packages, not subpackages
# like google.genai — so this forbids the whole `google` namespace, which is
# stricter than the letter of D12 but equivalent in effect (nothing else here
# has a legitimate reason to import any google.* package).
[[tool.importlinter.contracts]]
name = "Vendor SDK coupling confined to teacher.py"
type = "forbidden"
source_modules = ["twin.core", "twin.config", "twin.ingest", "twin.memory", "twin.train", "twin.agent", "twin.harness", "twin.cli"]
forbidden_modules = ["google"]

# SPEC.md §7.1: train.py must not know about any specific cloud.
[[tool.importlinter.contracts]]
name = "train.py stays cloud-agnostic"
type = "forbidden"
source_modules = ["twin.train"]
forbidden_modules = ["modal", "kaggle", "lightning_sdk", "boto3", "runpod"]

# Phase 4: trl and bitsandbytes are unambiguously training-SFT-specific with
# no legitimate inference-time use, unlike torch/transformers/peft (Phase 11's
# agent will legitimately need those to load a trained adapter and run
# inference) — so only these two get confined to twin.train specifically.
[[tool.importlinter.contracts]]
name = "Training-loop-specific deps confined to twin.train"
type = "forbidden"
source_modules = ["twin.core", "twin.config", "twin.teacher", "twin.ingest", "twin.memory", "twin.agent", "twin.harness", "twin.cli"]
forbidden_modules = ["trl", "bitsandbytes"]

# The eval harness is a leaf, same reasoning as ai-studio's api/bots: the real
# production path must not depend on the eval plumbing.
[[tool.importlinter.contracts]]
name = "Eval harness stays a leaf"
type = "forbidden"
source_modules = ["twin.core", "twin.config", "twin.teacher", "twin.ingest", "twin.memory", "twin.train", "twin.agent"]
forbidden_modules = ["twin.harness"]
