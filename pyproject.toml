[project]
name = "ai-studio"
version = "0.1.0"
description = "AI video and image generation on RunPod — MiniMax H3 clips and Flux.1-dev images assembled with a rigorous editing grammar"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.14"
keywords = ["runpod", "comfyui", "video-generation", "image-generation", "minimax-h3", "flux", "ffmpeg"]

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    # Unconditional, not `; platform_system == "Windows"`: budget.py builds
    # ZoneInfo("Asia/Taipei") at import time, and a slim Linux image is just as
    # likely to ship without a system tz database as Windows is. ~350KB.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]

[project.scripts]
ai-studio = "ai_studio.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
    "types-pyyaml>=6.0",
    "pre-commit>=3.7",
    # `deploy/inference_server.py` is a standalone FastAPI app that runs on the
    # pod; its /submit route uses File()/Form()/UploadFile, which FastAPI only
    # supports with python-multipart installed -- without both, even importing
    # the module (to unit-test its slot-safety logic) raises at the decorator.
    # Neither is a dependency of this package; the pod installs its own copies
    # (see deploy/pod_setup.sh). The web service that takes requests lives in
    # fun_workflow/, with its own web stack.
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_studio"]

# ---------------------------------------------------------------- tooling

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# typer's whole API is call-in-default (`= typer.Option(...)`). B008 is correct
# advice in general and wrong for this one library.
"src/ai_studio/cli/*.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/ai_studio"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "ffmpeg: requires a working ffmpeg on PATH",
    "runpod: requires RunPod credentials and spends money",
]

# ---------------------------------------------------------------- layering
# These contracts are the architecture. They exist from day 1 on purpose:
# retrofitting layering onto a grown codebase is how this design would die.
# See docs/architecture.md.

[tool.importlinter]
root_package = "ai_studio"

[[tool.importlinter.contracts]]
name = "Layered spine"
type = "layers"
layers = [
    "ai_studio.cli",
    "ai_studio.runtime",
    "ai_studio.pipeline",
    "ai_studio.providers",
    "ai_studio.comfy",
    "ai_studio.inference",
    "ai_studio.llm",
    "ai_studio.storage",
    "ai_studio.media",
    "ai_studio.benchmark",
    "ai_studio.checks",
    "ai_studio.config",
    "ai_studio.core",
]

[[tool.importlinter.contracts]]
# The prompt builder must stay testable with no network. It takes an `LlmClient`
# by protocol; the concrete client lives higher up and is injected.
name = "Prompt building does no I/O"
type = "forbidden"
source_modules = ["ai_studio.prompts"]
forbidden_modules = [
    "ai_studio.llm",
    "ai_studio.providers",
    "ai_studio.comfy",
    "ai_studio.pipeline",
    "ai_studio.runtime",
    "ai_studio.storage",
]

[[tool.importlinter.contracts]]
name = "Editing grammar stays infrastructure-free"
type = "forbidden"
source_modules = ["ai_studio.editing"]
forbidden_modules = [
    "ai_studio.providers",
    "ai_studio.comfy",
    "ai_studio.render",
    "ai_studio.runtime",
    "ai_studio.pipeline",
    "ai_studio.storage",
    "ai_studio.media",
]

[[tool.importlinter.contracts]]
name = "Gates are pure functions of on-disk artifacts"
type = "forbidden"
source_modules = ["ai_studio.gates"]
forbidden_modules = [
    "ai_studio.providers",
    "ai_studio.comfy",
    "ai_studio.render",
    "ai_studio.runtime",
]

[[tool.importlinter.contracts]]
name = "Swapping the model cannot touch editing"
type = "forbidden"
source_modules = ["ai_studio.render"]
forbidden_modules = ["ai_studio.providers", "ai_studio.comfy"]
